# Overlay for the existing ACA STEP 1 Docker Compose.
# Start with: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# No Docker socket is exposed: Traefik uses a file-based router definition.
services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--api.dashboard=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    volumes:
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./deploy/traefik/acme:/letsencrypt
      - ./deploy/traefik/users.htpasswd:/etc/traefik/users.htpasswd:ro
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
  frontend:
    networks:
      - private
      - edge
  backend:
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: "https://control.amalficoastartistry.com"
networks:
  edge:
    driver: bridge
    name: aca_control_edge
