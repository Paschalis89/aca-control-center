http:
  routers:
    aca-control:
      rule: "Host(`control.amalficoastartistry.com`)"
      entryPoints:
        - websecure
      service: aca-frontend
      middlewares:
        - aca-security-headers
      tls:
        certResolver: letsencrypt
  middlewares:
    aca-security-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
  services:
    aca-frontend:
      loadBalancer:
        servers:
          - url: http://frontend:80
